# Configuração das Edge Functions deste projeto.
# O webhook da Meta não manda JWT do Supabase: a autenticação dele é a
# assinatura X-Hub-Signature-256, validada no código.
[functions.salao-webhook]
verify_jwt = false

# Desativada (responde 410): o envio é pelo app do WhatsApp.
[functions.salao-responder]
verify_jwt = true

# Chamadas pelo pg_cron (sem JWT): só fazem o que já está previsto e não devolvem dados.
[functions.salao-lembrete]
verify_jwt = false

[functions.salao-sincronizar]
verify_jwt = false
