<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; connect-src https://yzmyncxoskvqzdczaill.supabase.co wss://yzmyncxoskvqzdczaill.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Conversas do salão</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root { --bg:#fafafa; --fg:#1a1a1a; --muted:#666; --line:#ddd; --card:#fff; --cliente:#fff; --bot:#e8f0fe; --humano:#e6f4ea; --alerta:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#eee; --muted:#aaa; --line:#333; --card:#1e1e1e; --cliente:#1e1e1e; --bot:#1c2a44; --humano:#1d3326; --alerta:#f28b82; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; flex:1; }
  header img { width:32px; height:32px; border-radius:50%; }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); cursor:pointer; }
  input, textarea { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); width:100%; }
  #login { max-width:320px; margin:48px auto; padding:0 16px; display:grid; gap:8px; }
  #app { display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 49px); }
  #lista { border-right:1px solid var(--line); overflow-y:auto; }
  .item { padding:10px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item.ativo { background:var(--bot); }
  .item small { color:var(--muted); display:block; }
  .tag { font-size:12px; padding:1px 6px; border-radius:10px; border:1px solid currentColor; margin-left:4px; }
  .alerta { color:var(--alerta); }
  #conversa { display:flex; flex-direction:column; min-width:0; }
  #topo { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #topo strong { flex:1; }
  #msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:75%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); white-space:pre-wrap; word-wrap:break-word; }
  .msg.cliente { background:var(--cliente); align-self:flex-start; }
  .msg.bot { background:var(--bot); align-self:flex-end; }
  .msg.humano { background:var(--humano); align-self:flex-end; }
  .msg small { display:block; color:var(--muted); font-size:12px; margin-top:4px; }
  #envio { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  #envio textarea { height:60px; resize:vertical; }
  #falhas { padding:16px; overflow:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td, th { border:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top; }
  .oculto { display:none !important; }
  #servicos { padding:16px; overflow:auto; display:grid; gap:8px; align-content:start; }
  @media (max-width:700px) { #app { grid-template-columns:1fr; } #lista { max-height:35vh; border-right:0; border-bottom:1px solid var(--line); } .msg { max-width:90%; } }
</style>
</head>
<body>
<header>
  <img src="../logo.png" alt="" width="32" height="32">
  <h1>Conversas do salão</h1>
  <button id="btnServicos" class="oculto">Serviços</button>
  <button id="btnFalhas" class="oculto">Falhas de envio</button>
  <button id="btnSair" class="oculto">Sair</button>
</header>

<form id="login">
  <input id="email" type="email" placeholder="e-mail" required autocomplete="username">
  <input id="senha" type="password" placeholder="senha" required autocomplete="current-password">
  <button>Entrar</button>
  <p id="erroLogin" class="alerta"></p>
</form>

<div id="app" class="oculto">
  <nav id="lista"></nav>
  <section id="conversa">
    <div id="topo"><strong>Escolha uma conversa</strong></div>
    <div id="msgs"></div>
    <form id="envio" class="oculto">
      <textarea id="texto" placeholder="Responder como humana (pausa o bot desta conversa)"></textarea>
      <button>Enviar</button>
    </form>
    <div id="falhas" class="oculto"></div>
    <div id="servicos" class="oculto"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="painel.js"></script>
</body>
</html>
